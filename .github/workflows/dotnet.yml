name: Student_Database_Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  student-database:
    runs-on: windows-latest

    steps:
    # 1️⃣ Checkout repo
    - name: Checkout source
      uses: actions/checkout@v4

    # 2️⃣ Restore NuGet (solution-level)
    - name: Restore NuGet packages
      shell: pwsh
      run: |
        nuget restore

    # 3️⃣ Build using FULL MSBuild (not dotnet build)
    - name: Build application
      shell: pwsh
      run: |
        $solution = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
        if (-not $solution) { Write-Error "No solution file found"; exit 1 }

        $msbuild = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"
        & $msbuild $solution.FullName /p:Configuration=Release

    # 4️⃣ Publish using FULL MSBuild (THIS FIXES UpdateManifest)
    - name: Publish application
      shell: pwsh
      run: |
        $project = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
        if (-not $project) { Write-Error "No project file found"; exit 1 }

        $msbuild = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"
        & $msbuild $project.FullName `
          /p:Configuration=Release `
          /p:OutDir=${{ github.workspace }}\publish\ `
          /t:Build

    # 5️⃣ Upload published output
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: StudentDatabaseApp
        path: publish
