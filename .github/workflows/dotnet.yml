name: Student_Database

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
    # 1️⃣ Checkout code
    - uses: actions/checkout@v4

    # 2️⃣ Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 3️⃣ Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # 4️⃣ Build solution
    - name: Build
      run: dotnet build -c Release --no-restore

    # 5️⃣ Run tests
    - name: Test
      run: dotnet test --no-build --verbosity normal

    # 6️⃣ Publish project
    - name: Publish
      shell: pwsh
      run: |
        # Automatically find the first .csproj in your repo
        $project = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
        if (-not $project) { Write-Error "No .csproj found"; exit 1 }
        dotnet publish $project.FullName `
          -c Release `
          -o ./publish `
          -p:EnableWindowsTargeting=true

    # 7️⃣ Upload artifact (optional)
    - name: Upload published artifact
      uses: actions/upload-artifact@v4
      with:
        name: Student_Database_Publish
        path: ./publish
