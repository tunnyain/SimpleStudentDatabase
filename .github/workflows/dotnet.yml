# This workflow will build a .NET Student database project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Student_Database

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    # BUILD SOLUTION
    - name: Build
      run: dotnet build StudentDatabaseApp.sln -c Release --no-restore

    - name: Test
      run: dotnet test StudentDatabaseApp.sln --no-build --verbosity normal

    # PUBLISH PROJECT (THIS FIXES THE ERROR)
    - name: Publish
      run: dotnet publish StudentDatabaseApp/StudentDatabaseApp.csproj -c Release -o ./publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Student_Database_Publish
        path: ./publish

