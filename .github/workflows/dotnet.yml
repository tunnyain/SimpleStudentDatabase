# This workflow will build a .NET Student database project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Student_Database

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build Student_Database.sln -c Release --no-restore

    - name: Test
      run: dotnet test Student_Database.sln --no-build

    - name: Publish
      run: dotnet publish $(Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1).FullName -c Release -o ./publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Student_Database_Publish
        path: ./publish

    
