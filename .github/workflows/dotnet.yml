name: Student_Database_Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  workflow-job:
    runs-on: windows-latest

    steps:
    # 1️⃣ Checkout the repo
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2️⃣ Setup .NET SDK (optional, mostly for console / library projects)
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 3️⃣ Restore NuGet packages
    - name: Restore NuGet Packages
      run: nuget restore StudentDatabaseApp.sln

    # 4️⃣ Build solution using MSBuild
    - name: Build Solution
      shell: pwsh
      run: |
        $solution = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
        if (-not $solution) { Write-Error "No solution file found"; exit 1 }
        # Use MSBuild from VS Build Tools
        $msbuild = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"
        & $msbuild $solution.FullName /p:Configuration=Release

    # 5️⃣ Publish project using MSBuild (handles UpdateManifest)
    - name: Publish Project
      shell: pwsh
      run: |
        $project = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
        if (-not $project) { Write-Error "No project file found"; exit 1 }
        $msbuild = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"
        & $msbuild $project.FullName `
          /p:Configuration=Release `
          /p:OutDir=./publish `
          /t:Build,Publish

    # 6️⃣ Optional: Upload published artifact
    - name: Upload Published Output
      uses: actions/upload-artifact@v4
      with:
        name: StudentDatabaseApp_Publish
        path: ./publish
