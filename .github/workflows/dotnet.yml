name: Student_Database

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    # BUILD THE SOLUTION
    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

    # FIND & PUBLISH THE PROJECT (NO HARD-CODED PATH)
    - name: Publish
      shell: pwsh
      run: |
        $project = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
        if (-not $project) {
          Write-Error "No .csproj file found"
          exit 1
        }
        dotnet publish $project.FullName -c Release -o ./publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Student_Database_Publish
        path: ./publish
